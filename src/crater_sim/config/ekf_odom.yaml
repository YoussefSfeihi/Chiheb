# Wheel + IMU odometry fusion (robot_localization EKF, 2D).
# Skid-steer wheels slip when turning, so wheel odometry is trusted ONLY for
# forward velocity (vx; vy = 0 non-holonomic constraint). Yaw rate comes from the
# IMU gyro. Output: /odom + TF odom->base_link (consumed by SLAM, Nav2, localizer).
ekf_odom:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    odom0: /wheel/odom
    #            x      y      z      roll   pitch  yaw
    #            vx     vy     vz     vroll  vpitch vyaw
    #            ax     ay     az
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, false,
                   false, false, false]
    odom0_differential: false

    imu0: /imu
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
